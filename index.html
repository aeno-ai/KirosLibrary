<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <!-- viewport-fit=cover lets the app use the full iPhone screen; the CSS
         then uses env(safe-area-inset-*) to stay clear of the notch. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- theme-color tints the browser bar / phone status bar. The media
         attribute picks one per colour scheme, matching the CSS themes. -->
    <meta name="theme-color" content="#ffa6c9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#24131c" media="(prefers-color-scheme: dark)" />
    <!-- The manifest makes the site installable; iOS reads its own
         apple-touch-icon for the Home Screen instead of the manifest icons. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>Kiro's Library</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
